<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0a1128" />
      <stop offset="75%" stop-color="#141236" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Holographic Text Gradient with Shimmer -->
    <linearGradient id="holoShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="60%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="aiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes pulseBeam {
      0%, 100% { stroke-dashoffset: 200; opacity: 0.2; }
      50% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes radarWave {
      0% { r: 5px; opacity: 1; }
      100% { r: 18px; opacity: 0; }
    }
    @keyframes nodeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes scanLine {
      0% { transform: translateY(-260px); }
      100% { transform: translateY(260px); }
    }

    .beam {
      stroke-dasharray: 40, 160;
      animation: pulseBeam 4s linear infinite;
    }
    .beam-delayed {
      stroke-dasharray: 50, 150;
      animation: pulseBeam 5s linear infinite;
      animation-delay: 2s;
    }
    .node-anim { animation: nodeFloat 6s ease-in-out infinite; }
    .cursor { animation: blinkCursor 0.8s infinite; }
    .radar { animation: radarWave 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
  </style>

  <!-- Card Frame -->
  <rect width="898" height="258" x="1" y="1" rx="18" fill="url(#cyberBg)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" />
  <rect width="898" height="258" x="1" y="1" rx="18" fill="url(#techGrid)" />

  <!-- Neural Connection Beams -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.6">
    <line x1="80" y1="130" x2="220" y2="60" class="beam" />
    <line x1="220" y1="60" x2="380" y2="40" class="beam-delayed" />
    <line x1="820" y1="130" x2="680" y2="60" class="beam" />
    <line x1="680" y1="60" x2="520" y2="40" class="beam-delayed" />
    <line x1="120" y1="200" x2="260" y2="210" class="beam-delayed" />
    <line x1="780" y1="200" x2="640" y2="210" class="beam" />
  </g>

  <!-- Ambient Glowing Nodes -->
  <g class="node-anim">
    <circle cx="80" cy="130" r="5" fill="#38bdf8" filter="url(#aiGlow)" />
    <circle cx="220" cy="60" r="4" fill="#818cf8" filter="url(#aiGlow)" />
    <circle cx="820" cy="130" r="5" fill="#c084fc" filter="url(#aiGlow)" />
    <circle cx="680" cy="60" r="4" fill="#38bdf8" filter="url(#aiGlow)" />
    <circle cx="120" cy="200" r="3.5" fill="#f43f5e" />
    <circle cx="780" cy="200" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Corner Tech Accent Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
  <path d="M 880 40 L 880 20 L 860 20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
  <path d="M 20 220 L 20 240 L 40 240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
  <path d="M 880 220 L 880 240 L 860 240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" />

  <!-- Center Content -->
  <!-- Tagline Top -->
  <text class="font-mono" x="450" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="4" opacity="0.9">
    // SYSTEM ARCHITECTURE: AGENTIC AI &amp; LLM ORCHESTRATION //
  </text>

  <!-- Main Name Title -->
  <text class="font-sans" x="450" y="112" text-anchor="middle" font-size="44" font-weight="900" fill="url(#holoShimmer)" letter-spacing="2">
    LUCKY RATHEE
  </text>

  <!-- Subtitle -->
  <text class="font-sans" x="450" y="148" text-anchor="middle" font-size="17" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">
    AI Engineer · Automation Architect · Multi-Agent LLM Systems
  </text>

  <!-- Terminal Style Capabilities Stream -->
  <g transform="translate(190, 172)">
    <rect width="520" height="34" rx="8" fill="#030712" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text class="font-mono" x="20" y="22" font-size="12" fill="#94a3b8">
      <tspan fill="#38bdf8">agentic-os:~$</tspan> spawn --skills=27 --mcp --rag --playwright<tspan class="cursor" fill="#38bdf8">_</tspan>
    </text>
  </g>

  <!-- Bottom Badges / Status Indicator -->
  <g transform="translate(365, 222)">
    <circle class="radar" cx="10" cy="7" r="5" fill="none" stroke="#10b981" stroke-width="1.5" />
    <circle cx="10" cy="7" r="4.5" fill="#10b981" />
    <text class="font-mono" x="26" y="11" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">
      CORES ONLINE · READY FOR DEPLOYMENT
    </text>
  </g>
</svg>

