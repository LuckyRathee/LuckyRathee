<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="laserGlow">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes laserScan {
      0% { transform: translateX(-150px); }
      50% { transform: translateX(950px); }
      100% { transform: translateX(-150px); }
    }
    .scanner {
      animation: laserScan 4s ease-in-out infinite;
    }
  </style>
  <!-- Background Base Track -->
  <line x1="20" y1="12" x2="880" y2="12" stroke="#1e293b" stroke-width="1.5" />
  <!-- Neon Gradient Line -->
  <line x1="40" y1="12" x2="860" y2="12" stroke="url(#neonLine)" stroke-width="2" />
  <!-- Moving Laser Scanner -->
  <g class="scanner">
    <line x1="0" y1="12" x2="120" y2="12" stroke="url(#pulseGlow)" stroke-width="3" filter="url(#laserGlow)" />
    <circle cx="60" cy="12" r="3" fill="#ffffff" filter="url(#laserGlow)" />
  </g>
  <!-- Decorative Diamonds -->
  <polygon points="450,7 455,12 450,17 445,12" fill="#818cf8" filter="url(#laserGlow)" />
  <polygon points="50,9 53,12 50,15 47,12" fill="#38bdf8" />
  <polygon points="850,9 853,12 850,15 847,12" fill="#c084fc" />
</svg>

